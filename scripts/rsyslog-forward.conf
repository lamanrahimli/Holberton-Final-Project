# rsyslog forwarding to Kharibulbul (alternative to installing the agent on small Linux hosts / appliances)
# Copy to /etc/rsyslog.d/90-kharibulbul.conf and: systemctl restart rsyslog
#
# UDP 5514 (default in config/server.yml). Use @@ for TCP if ingest.syslog_tcp is enabled.
*.* @10.10.10.5:5514;RSYSLOG_SyslogProtocol23Format

# Only auth + kernel (firewall) lines instead of everything:
# auth,authpriv.*  @10.10.10.5:5514;RSYSLOG_SyslogProtocol23Format
# kern.*           @10.10.10.5:5514;RSYSLOG_SyslogProtocol23Format
