suppress: 6h
playbook: playbooks/PB-008-persistence.md
---
id: KB-WIN-032
title: Scheduled task created or updated with suspicious action
description: Security 4698/4702 where the task action runs PowerShell, cmd, a script host, LOLBins, hidden windows or binaries from user directories.
severity: high
tags: [windows, persistence, scheduled-task]
mitre:
  - { technique: T1053.005, tactic: persistence }
logsource: { dataset: windows.security }
detection:
  selection:
    event.action: [scheduled-task-created, scheduled-task-updated]
    process.command_line|contains:
      - powershell
      - pwsh
      - cmd.exe
      - cmd /c
      - wscript
      - cscript
      - mshta
      - rundll32
      - regsvr32
      - certutil
      - bitsadmin
      - "\\users\\"
      - "\\temp\\"
      - "\\programdata\\"
      - "\\appdata\\"
      - "\\public\\"
      - hidden
      - -enc
      - bypass
      - "-w hidden"
  condition: selection
group_by: [host.name, winlog.task.name]
suppress: 1h
playbook: playbooks/PB-008-persistence.md
---
