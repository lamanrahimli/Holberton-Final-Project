# Windows persistence rules (services, scheduled tasks)
id: KB-WIN-030
title: Service installed with a suspicious binary path
description: >
  New service (System 7045 / Security 4697) whose image path lives in a user-writable or temporary
  directory, or launches a script host / PowerShell / cmd - typical for persistence and psexec-style tools.
severity: high
tags: [windows, persistence, privilege-escalation]
mitre:
  - { technique: T1543.003, tactic: persistence }
  - { technique: T1569.002, tactic: execution }
logsource: { module: windows }
detection:
  selection:
    event.action: service-installed
    service.path|contains:
      - "\\temp\\"
      - "\\users\\"
      - "\\programdata\\"
      - "\\appdata\\"
      - "\\public\\"
      - "\\downloads\\"
      - "\\recycler"
      - "powershell"
      - "pwsh"
      - "cmd.exe /c"
      - "cmd /c"
      - "rundll32"
      - "regsvr32"
      - "mshta"
      - "wscript"
      - "cscript"
      - "comspec"
      - "\\\\127.0.0.1\\"
      - "admin$"
      - "-enc"
      - "base64"
  condition: selection
group_by: [host.name, service.name]
suppress: 1h
playbook: playbooks/PB-008-persistence.md
