id: KB-SYS-017
title: Reconnaissance command burst (whoami, net, ipconfig, systeminfo...)
description: 5 or more discovery commands from the same user on one host within 2 minutes - post-exploitation situational awareness.
severity: medium
tags: [windows, sysmon, discovery]
mitre:
  - { technique: T1087, tactic: discovery }
  - { technique: T1082, tactic: discovery }
  - { technique: T1016, tactic: discovery }
logsource: { module: windows }
detection:
  selection:
    event.action: process-created
    process.name: [whoami.exe, net.exe, net1.exe, ipconfig.exe, systeminfo.exe, nltest.exe, tasklist.exe, quser.exe, hostname.exe, arp.exe, route.exe, netstat.exe, qwinsta.exe, dsquery.exe, nslookup.exe]
  condition: selection
threshold:
  count: 5
  window: 2m
  group_by: [host.name, user.name]
suppress: 30m
playbook: playbooks/PB-003-lolbin.md
---
id: KB-SYS-018
title: Multiple reconnaissance commands chained in one command line
description: A single command line that chains two or more discovery commands (whoami & net user & ipconfig ...), typical of scripted recon.
severity: medium
tags: [windows, sysmon, discovery]
mitre:
  - { technique: T1087, tactic: discovery }
logsource: { module: windows }
detection:
  selection:
    event.action: process-created
    process.command_line|re: '(whoami|net\s+user|net\s+localgroup|net\s+group|ipconfig|systeminfo|tasklist|nltest|quser|qwinsta|arp\s+-a|netstat).*(&|\||;).*(whoami|net\s+user|net\s+localgroup|net\s+group|ipconfig|systeminfo|tasklist|nltest|quser|qwinsta|arp\s+-a|netstat)'
  condition: selection
group_by: [host.name, user.name]
suppress: 30m
playbook: playbooks/PB-003-lolbin.md
