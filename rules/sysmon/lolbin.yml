# Living-off-the-land binaries (Sysmon 1 / Security 4688 process creation)
id: KB-SYS-010
title: certutil used to download or decode
description: certutil.exe with -urlcache / -decode / -encode / -verifyctl - abused to fetch or decode payloads with a signed Microsoft binary.
severity: high
tags: [windows, sysmon, lolbin, execution]
mitre:
  - { technique: T1105, tactic: command-and-control }
  - { technique: T1140, tactic: defense-evasion }
logsource: { module: windows }
detection:
  selection:
    event.action: process-created
    process.name: certutil.exe
    process.command_line|contains: [urlcache, -decode, -encode, verifyctl, "-split", "http"]
  condition: selection
group_by: [host.name, user.name]
suppress: 30m
playbook: playbooks/PB-003-lolbin.md
---
id: KB-SYS-011
title: mshta executing remote or inline script
description: "mshta.exe with a URL, javascript:/vbscript: protocol or an .hta file - HTML application execution used by phishing chains."
severity: high
tags: [windows, sysmon, lolbin, execution]
mitre:
  - { technique: T1218.005, tactic: defense-evasion }
logsource: { module: windows }
detection:
  selection:
    event.action: process-created
    process.name: mshta.exe
    process.command_line|contains: ["http", "javascript:", "vbscript:", ".hta", "\\users\\", "\\temp\\", "\\appdata\\"]
  condition: selection
group_by: [host.name, user.name]
suppress: 30m
playbook: playbooks/PB-003-lolbin.md
---
id: KB-SYS-012
title: rundll32 with script protocol or unusual DLL location
description: "rundll32.exe running javascript:/vbscript: payloads, url.dll/advpack tricks, or a DLL from a user-writable path."
severity: high
tags: [windows, sysmon, lolbin, execution]
mitre:
  - { technique: T1218.011, tactic: defense-evasion }
logsource: { module: windows }
detection:
  selection:
    event.action: process-created
    process.name: rundll32.exe
    process.command_line|contains:
      - "javascript:"
      - "vbscript:"
      - "url.dll,"
      - "advpack.dll,"
      - "ieadvpack.dll,"
      - "shell32.dll,#"
      - "\\users\\"
      - "\\temp\\"
      - "\\appdata\\"
      - "\\programdata\\"
      - "\\public\\"
  condition: selection
group_by: [host.name, user.name]
suppress: 30m
playbook: playbooks/PB-003-lolbin.md
---
id: KB-SYS-013
title: regsvr32 loading a remote or script-based COM object (squiblydoo)
description: regsvr32.exe with /i:http or scrobj.dll / .sct - executes scriptlets while looking like a normal DLL registration.
severity: high
tags: [windows, sysmon, lolbin, execution]
mitre:
  - { technique: T1218.010, tactic: defense-evasion }
logsource: { module: windows }
detection:
  selection:
    event.action: process-created
    process.name: regsvr32.exe
    process.command_line|contains: ["/i:http", "/i:ftp", "scrobj", ".sct", "/u /s", "\\users\\", "\\temp\\", "\\appdata\\"]
  condition: selection
group_by: [host.name, user.name]
suppress: 30m
playbook: playbooks/PB-003-lolbin.md
