id: KB-SYS-015
title: WMIC process call create / remote node execution
description: wmic.exe used to start processes (locally or on /node:) - lateral movement and defense evasion.
severity: high
tags: [windows, sysmon, lolbin, lateral-movement]
mitre:
  - { technique: T1047, tactic: execution }
logsource: { module: windows }
detection:
  selection_create:
    event.action: process-created
    process.name: wmic.exe
    process.command_line|contains|all: [process, call, create]
  selection_node:
    event.action: process-created
    process.name: wmic.exe
    process.command_line|contains: ["/node:", "shadowcopy delete", "/format:"]
  condition: 1 of selection_*
group_by: [host.name, user.name]
suppress: 30m
playbook: playbooks/PB-003-lolbin.md
---
id: KB-SYS-016
title: Script host executing from a user-writable directory
description: wscript/cscript running a script from Users, Temp, AppData, Public or Downloads - common phishing payload stage.
severity: medium
tags: [windows, sysmon, lolbin, execution]
mitre:
  - { technique: T1059.005, tactic: execution }
  - { technique: T1059.007, tactic: execution }
logsource: { module: windows }
detection:
  selection:
    event.action: process-created
    process.name: [wscript.exe, cscript.exe]
    process.command_line|contains: ["\\users\\", "\\temp\\", "\\appdata\\", "\\public\\", "\\downloads\\", "\\programdata\\"]
  condition: selection
group_by: [host.name, user.name]
suppress: 30m
playbook: playbooks/PB-003-lolbin.md
